server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Floor plan PDFs can be large (backend limit is 50 MB)
    client_max_body_size 50m;

    # API (including the SSE progress stream) goes to the backend container
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;          # stream SSE progress events as they happen
        proxy_read_timeout 600s;      # PDF analyses can take minutes
    }

    # Single-page app: unknown paths fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
