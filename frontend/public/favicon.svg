<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0EA5E9"/>
      <stop offset="100%" stop-color="#00F0FF"/>
    </linearGradient>
  </defs>
  <!-- Background rounded square -->
  <rect width="32" height="32" rx="6" fill="#0f172a"/>
  <!-- Floor plan lines -->
  <rect x="5" y="5" width="22" height="22" rx="1.5" fill="none" stroke="url(#g)" stroke-width="1.8"/>
  <!-- Horizontal room divider -->
  <line x1="5" y1="15" x2="19" y2="15" stroke="url(#g)" stroke-width="1.5"/>
  <!-- Vertical room divider -->
  <line x1="16" y1="5" x2="16" y2="15" stroke="url(#g)" stroke-width="1.5"/>
  <!-- Door arc top-right room -->
  <path d="M 19 15 A 4 4 0 0 1 23 11" fill="none" stroke="#00F0FF" stroke-width="1" opacity="0.7"/>
  <!-- Door arc bottom room -->
  <path d="M 5 20 A 5 5 0 0 0 10 25" fill="none" stroke="#00F0FF" stroke-width="1" opacity="0.7"/>
  <!-- "A" letter tiny -->
  <text x="16" y="24.5" font-family="sans-serif" font-weight="700" font-size="9" fill="url(#g)" text-anchor="middle">A</text>
</svg>
