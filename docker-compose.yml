# One-command start:  docker compose up --build   ->  http://localhost:8080
services:
  backend:
    build: .
    env_file:
      - path: .env          # optional: secret key, OAuth credentials
        required: false
    volumes:
      - data:/app/data
      - uploads:/app/backend/uploads
      - results:/app/backend/results
      - ocr-models:/app/results/easyocr_cache
    ports:
      - "8000:8000"         # direct API access and OAuth callbacks
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 12

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  data:
  uploads:
  results:
  ocr-models:
